<!DOCTYPE html>
<html lang="pt-BR">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>
		CarneCerta | Churrasco
	</title>

	<link
		rel="stylesheet"
		href="../../css/style.css"
	>

	<link
		rel="stylesheet"
		href="../../css/categorias.css"
	>

</head>

<body>

	<main class="preferences-page">

		<section class="preferences-container">

			<div class="preferences-header">

				<span class="preferences-tag">
					🔥 Churrasco
				</span>

				<h1>
					Escolha suas preferências
				</h1>

				<p>
					Responda rapidamente para encontrarmos
					o corte ideal para o seu churrasco.
				</p>

			</div>

		</section>

		<section class="preferences-grid single-card-grid">

			<div class="preferences-card single-choice-card">

				<div class="question-block" data-question="priority">

					<h2>
						O que importa mais?
					</h2>

					<div class="options-grid">

						<button class="option-btn">
							🥩 Mais macia
						</button>

						<button class="option-btn">
							💰 Melhor custo-benefício
						</button>

						<button class="option-btn">
							🥗 Menos gordura
						</button>

						<button class="option-btn">
							🔥 Mais sabor
						</button>

					</div>

				</div>

				<div class="question-block" data-question="cutpreference">

					<h2>
						Espessura para churrasco
					</h2>

					<div class="options-grid">

						<button class="option-btn">
							🔪 Médio
						</button>

						<button class="option-btn">
							🔪 Grosso
						</button>

						<button class="option-btn">
							🥩 Peça inteira
						</button>

					</div>

				</div>

				<div class="question-block" data-question="people">

					<h2>
						Para quantas pessoas?
					</h2>

					<div class="options-grid">

						<button class="option-btn">
							👤 1-2
						</button>

						<button class="option-btn">
							👥 3-5
						</button>

						<button class="option-btn">
							🍽️ 6-8
						</button>

						<button class="option-btn">
							🎉 9+
						</button>

					</div>

				</div>

				<div class="continue-area">
					<button class="continue-btn" data-category="churrasco">
						Ver melhores cortes
					</button>
				</div>

			</div>

		</section>

	</main>

	<script src="../../data/cortes.js"></script>
	<script src="../../script.js"></script>

</body>

</html>
