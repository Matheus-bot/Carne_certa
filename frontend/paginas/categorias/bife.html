<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    CarneCerta | Para Bife
  </title>

  <link
    rel="stylesheet"
    href="../../css/style.css"
  >

  <link
    rel="stylesheet"
    href="../../css/categorias.css"
  >

</head>

<body>
  <main class="preferences-page">

    <section class="preferences-container">

      <div class="preferences-header">

        <span class="preferences-tag">
          🥩 Para Bife
        </span>

        <h1>
          Escolha suas preferências
        </h1>

        <p>
          Responda rapidamente para encontrarmos
          o corte ideal para seu bife.
        </p>

      </div>

    </section>

    <section class="preferences-grid">

      <div class="preferences-card">

  <h2>
    Como prefere o bife?
  </h2>

  <div class="options-grid">

    <button class="option-btn">
      🔥 Alto
    </button>

    <button class="option-btn">
      🔪 Fino
    </button>

    <button class="option-btn">
      🍳 Frito
    </button>

    <button class="option-btn">
      🔥 Grelhado
    </button>

  </div>

  </div>

  <div class="preferences-card">

  <h2>
    O que importa mais?
  </h2>

  <div class="options-grid">

    <button class="option-btn">
      🥩 Muito macio
    </button>

    <button class="option-btn">
      💰 Mais barato
    </button>

    <button class="option-btn">
      🥗 Pouca gordura
    </button>

    <button class="option-btn">
      🔥 Mais sabor
    </button>

  </div>

  </div>

  <div class="preferences-card">

  <h2>
    Para quantas pessoas?
  </h2>

  <div class="options-grid">

    <button class="option-btn">
      👤 1-2
    </button>

    <button class="option-btn">
      👥 3-4
    </button>

    <button class="option-btn">
      🍽️ 5-6
    </button>

    <button class="option-btn">
      🎉 7+
    </button>

  </div>

        <div class="continue-area">
          <button class="continue-btn">

            Ver melhores cortes

          </button>
        </div>

      </div>

    </section>

  </main>

  <script src="../../script.js"></script>

</body>

</html>
