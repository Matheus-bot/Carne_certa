<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    CarneCerta | Para Bife
  </title>

  <link
    rel="stylesheet"
    href="../../css/style.css"
  >

  <link
    rel="stylesheet"
    href="../../css/categorias.css"
  >

</head>

<body>

  <main class="preferences-page">

    <section class="preferences-container">

      <a href="../../index.html" class="back-button">← Voltar ao catálogo</a>

      <div class="preferences-header">

        <span class="preferences-tag">
          🥩 Para Bife
        </span>

        <h1>
          Escolha suas preferências
        </h1>

        <p>
          Responda rapidamente para encontrarmos
          o corte ideal para seu bife.
        </p>

      </div>

    </section>

    <section class="preferences-grid single-card-grid">

      <div class="preferences-card single-choice-card">

        <div class="question-block" data-question="bifetype">

          <h2>
            Qual tipo de bife?
          </h2>

          <div class="options-grid">

            <button class="option-btn">
              🥩 Bife normal
            </button>

            <button class="option-btn">
              🔪 Bife a rolê
            </button>

          </div>

        </div>

        <div class="question-block" data-question="priority">

          <h2>
            O que importa mais?
          </h2>

          <div class="options-grid">

            <button class="option-btn">
              🥩 Muito macio
            </button>

            <button class="option-btn">
              💰 Mais barato
            </button>

            <button class="option-btn">
              🥗 Pouca gordura
            </button>

            <button class="option-btn">
              🔥 Mais sabor
            </button>

          </div>

        </div>

        <div class="question-block" data-question="cutpreference">

          <h2>
            Espessura do bife
          </h2>

          <div class="options-grid">

            <button class="option-btn">
              🔪 Fino
            </button>

            <button class="option-btn">
              🔪 Médio
            </button>

            <button class="option-btn">
              🔪 Grosso
            </button>

          </div>

        </div>

        <div class="question-block" data-question="people">

          <h2>
            Para quantas pessoas?
          </h2>

          <div class="options-grid">

            <button class="option-btn">
              👤 1-2
            </button>

            <button class="option-btn">
              👥 3-4
            </button>

            <button class="option-btn">
              🍽️ 5-6
            </button>

            <button class="option-btn">
              🎉 7+
            </button>

          </div>

        </div>

        <div class="continue-area">
          <button class="continue-btn" data-category="bife">
            Ver melhores cortes
          </button>
        </div>

      </div>

    </section>

  </main>

  <script src="../../data/cortes.js"></script>
  <script src="../../script.js"></script>

</body>

</html>
