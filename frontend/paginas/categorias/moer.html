<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    CarneCerta | Para Moer
  </title>

  <link
    rel="stylesheet"
    href="../../css/style.css"
  >

  <link
    rel="stylesheet"
    href="../../css/categorias.css"
  >

</head>

<body>

  <main class="preferences-page">

    <section class="preferences-container">

      <a href="../../index.html" class="back-button">← Voltar ao catálogo</a>

      <div class="preferences-header">

        <span class="preferences-tag">
          🥩 Para Moer
        </span>

        <h1>
          Escolha suas preferências
        </h1>

        <p>
          Defina o estilo da carne moída e a moagem ideal.
        </p>

      </div>

    </section>

    <section class="preferences-grid single-card-grid">

      <div class="preferences-card single-choice-card">

        <div class="question-block" data-question="priority">

          <h2>
            O que importa mais?
          </h2>

          <div class="options-grid">

            <button class="option-btn">
              💰 Mais barata
            </button>

            <button class="option-btn">
              🥗 Mais magra
            </button>

            <button class="option-btn">
              🔥 Mais sabor
            </button>

            <button class="option-btn">
              🥩 Mais macia
            </button>

          </div>

        </div>

        <div class="question-block" data-question="cutpreference">

          <h2>
            Perfil da moagem
          </h2>

          <div class="options-grid">

            <button class="option-btn">
              🥗 Magra
            </button>

            <button class="option-btn">
              ⚖️ Equilibrada
            </button>

            <button class="option-btn">
              🔥 Mais saborosa
            </button>

          </div>

        </div>

        <div class="question-block" data-question="grind">

          <h2>
            Quantas vezes moer?
          </h2>

          <div class="options-grid">

            <button class="option-btn">
              1x
            </button>

            <button class="option-btn">
              2x
            </button>

            <button class="option-btn">
              3x
            </button>

          </div>

        </div>

        <div class="question-block" data-question="people">

          <h2>
            Para quantas pessoas?
          </h2>

          <div class="options-grid">

            <button class="option-btn">
              👤 1-2
            </button>

            <button class="option-btn">
              👥 3-4
            </button>

            <button class="option-btn">
              🍽️ 5-6
            </button>

            <button class="option-btn">
              🎉 7+
            </button>

          </div>

        </div>

        <div class="continue-area">
          <button class="continue-btn" data-category="moer">
            Ver 3 opções ideais
          </button>
        </div>

      </div>

    </section>

  </main>

  <script src="../../data/cortes.js"></script>
  <script src="../../script.js"></script>

</body>

</html>
