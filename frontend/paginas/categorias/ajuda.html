<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    CarneCerta | Não sei, me ajude
  </title>

  <link
    rel="stylesheet"
    href="../../css/style.css"
  >

  <link
    rel="stylesheet"
    href="../../css/categorias.css"
  >

</head>

<body>

  <main class="preferences-page">

    <section class="preferences-container">

      <div class="preferences-header">

        <span class="preferences-tag">
          🤖 Não sei, me ajude
        </span>

        <h1>
          Vamos descobrir juntos o corte ideal
        </h1>

        <p>
          Responda algumas perguntas e o sistema monta 3 sugestões
          com quantidade e orientação para pedir no açougue.
        </p>

      </div>

    </section>

    <section class="preferences-grid single-card-grid">

      <div class="preferences-card single-choice-card">

        <div class="question-block" data-question="usecase">

          <h2>
            Qual preparo você quer fazer?
          </h2>

          <div class="options-grid">

            <button class="option-btn">
              🍲 Panela
            </button>

            <button class="option-btn">
              🥩 Bife
            </button>

            <button class="option-btn">
              🔥 Churrasco
            </button>

            <button class="option-btn">
              🍔 Hambúrguer
            </button>

            <button class="option-btn">
              🍖 Desfiar
            </button>

            <button class="option-btn">
              🥩 Moer
            </button>

          </div>

        </div>

        <div class="question-block" data-question="priority">

          <h2>
            O que mais importa para você?
          </h2>

          <div class="options-grid">

            <button class="option-btn">
              💰 Ser barata
            </button>

            <button class="option-btn">
              🥩 Ser macia
            </button>

            <button class="option-btn">
              🥗 Menos gordura
            </button>

            <button class="option-btn">
              🔥 Ter mais sabor
            </button>

          </div>

        </div>

        <div class="question-block" data-question="cutpreference">

          <h2>
            Preferência de corte
          </h2>

          <div class="options-grid">

            <button class="option-btn">
              🔪 Pequeno/fácil
            </button>

            <button class="option-btn">
              ⚖️ Médio/equilibrado
            </button>

            <button class="option-btn">
              🥩 Maior/suculento
            </button>

          </div>

        </div>

        <div class="question-block" data-question="people">

          <h2>
            Para quantas pessoas?
          </h2>

          <div class="options-grid">

            <button class="option-btn">
              👤 1-2
            </button>

            <button class="option-btn">
              👥 3-4
            </button>

            <button class="option-btn">
              🍽️ 5-6
            </button>

            <button class="option-btn">
              🎉 7+
            </button>

          </div>

        </div>

        <div class="continue-area">
          <button class="continue-btn" data-category="ajuda">
            Ver 3 opções ideais
          </button>
        </div>

      </div>

    </section>

  </main>

  <script src="../../data/cortes.js"></script>
  <script src="../../script.js"></script>

</body>

</html>
