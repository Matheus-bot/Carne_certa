<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link rel="manifest" href="../../manifest.webmanifest">

  <title>
    CarneCerta | Hambúrguer
  </title>

  <link
    rel="stylesheet"
    href="../../css/style.css"
  >

  <link
    rel="stylesheet"
    href="../../css/categorias.css"
  >

</head>

<body>

  <main class="preferences-page">

    <section class="preferences-container">

      <a href="../../index.html" class="back-button">← Voltar ao catálogo</a>

      <div class="preferences-header">

        <span class="preferences-tag">
          🍔 Hambúrguer
        </span>

        <h1>
          Monte seu blend ideal
        </h1>

        <p>
          Escolha o estilo que você quer e o sistema monta
          as melhores combinações com quantidade certa.
        </p>

      </div>

    </section>

    <section class="preferences-grid single-card-grid">

      <div class="preferences-card single-choice-card">

        <div class="question-block" data-question="mix">

          <h2>
            Quer misturar dois cortes?
          </h2>

          <div class="options-grid">

            <button class="option-btn">
              ✅ Sim - quero blend
            </button>

            <button class="option-btn">
              ❌ Não - corte único
            </button>

          </div>

        </div>

        <div class="question-block" data-question="mixprofile">

          <h2>
            Se for blend, qual estilo?
          </h2>

          <div class="options-grid">

            <button class="option-btn">
              🥩🥩 Duas carnes magras
            </button>

            <button class="option-btn">
              🥩+🔥 Uma magra + uma saborosa
            </button>

            <button class="option-btn">
              🔥 Sabor intenso
            </button>

          </div>

        </div>

        <div class="question-block" data-question="grind">

          <h2>
            Quantas vezes moer?
          </h2>

          <div class="options-grid">

            <button class="option-btn">
              1x
            </button>

            <button class="option-btn">
              2x
            </button>

            <button class="option-btn">
              3x
            </button>

          </div>

        </div>

        <div class="question-block" data-question="priority">

          <h2>
            O que importa mais?
          </h2>

          <div class="options-grid">

            <button class="option-btn">
              🥩 Mais macio
            </button>

            <button class="option-btn">
              💰 Melhor custo-benefício
            </button>

            <button class="option-btn">
              🥗 Menos gordura
            </button>

            <button class="option-btn">
              🔥 Mais sabor
            </button>

          </div>

        </div>

        <div class="question-block" data-question="people">

          <h2>
            Para quantas pessoas?
          </h2>

          <div class="options-grid">

            <button class="option-btn">
              👤 1-2
            </button>

            <button class="option-btn">
              👥 3-4
            </button>

            <button class="option-btn">
              🍽️ 5-6
            </button>

            <button class="option-btn">
              🎉 7+
            </button>

          </div>

        </div>

        <div class="continue-area">
          <button class="continue-btn" data-category="hamburguer">
            Ver 3 opções ideais
          </button>
        </div>

      </div>

    </section>

  </main>

  <script src="../../data/cortes.js"></script>
  <script src="../../script.js"></script>
  <script src="../../js/hamburguer-strategy.js"></script>

</body>

</html>
