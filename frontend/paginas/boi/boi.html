<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mapa do Boi</title>

  <link rel="stylesheet" href="../../css/style.css">

</head>

<body>

  <main class="cow-page">

    <div class="cow-header">

      <a href="../../index.html" class="back-button">
        ← Voltar para Home
      </a>

      <h1>Mapa Inteligente do Boi</h1>

      <p>
        Escolha o corte e siga direto para a página de detalhes.
      </p>

    </div>

    <section class="cow-map-shell" aria-labelledby="cow-map-title">

      <div class="cow-map-copy">
        <span class="cow-map-kicker">Mapa anatômico premium</span>
        <h2 id="cow-map-title">Selecione um corte e vá direto para os detalhes</h2>
        <p>
          Seis cortes com animações suaves, leitura clara e acesso imediato.
        </p>
      </div>

      <div class="cow-map-stage" data-cow-map>
        <img
          src="../../../assets/imagens/boi/boimodelofuncional.png"
          alt="Silhueta interativa do boi com destaque para cortes bovinos"
          class="cow-map-image"
          data-cow-image
        >

        <svg
          class="cow-map-lines"
          data-cow-lines
          viewBox="0 0 100 100"
          preserveAspectRatio="none"
          aria-hidden="true"
        ></svg>

        <div class="cow-map-hotspots" data-cow-hotspots aria-label="Mapa de cortes bovinos"></div>
      </div>
    </section>

  </main>

  <script src="../../script.js"></script>

</body>

</html>
