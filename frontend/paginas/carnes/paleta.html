<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Paleta | CarneCerta</title>

  <link rel="stylesheet" href="../../css/style.css">

</head>

<body>

  <main class="meat-page">

    <a href="../boi/boi.html" class="back-button">
      ← Voltar para o boi
    </a>

    <section class="meat-section">

      <div class="meat-image-area">

        <img
          src="../../../assets/imagens/carnes/paletagerada.png"
          alt="Imagem da Paleta"
          class="meat-image"
        >

      </div>

      <div class="meat-content">

        <span class="meat-tag">
          IDEAL PARA • PANELA • ENSOPADOS
        </span>

        <h1>
          Paleta
        </h1>

        <p class="meat-description">

          A paleta é um corte bovino muito utilizado em receitas de panela,
          conhecido pelo sabor marcante, ótimo custo-benefício e textura    

        </p>

        <div class="stats">

          <div class="stat-card">

            <h3>Maciez</h3>

            <p>⭐⭐</p>

          </div>

          <div class="stat-card">

            <h3>Gordura</h3>

            <p>⭐⭐⭐</p>

          </div>

          <div class="stat-card">

            <h3>Sabor</h3>

            <p>⭐⭐⭐⭐</p>

          </div>

        </div>

        <div class="recommendation-card">

          <span class="score">
            ⭐ 4.7
          </span>

          <p>
            Ótimo custo-benefício para carnes de panela.
          </p>

        </div>

        <button class="select-button">

          Ver detalhes e recomendações

        </button>

      </div>

    </section>

  </main>

</body>

</html>
